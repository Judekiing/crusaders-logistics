name: Crusaders Logistics CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel Shared Hosting
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js for Vite React Build (Node 22 avoids deprecation warning)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build Production React Frontend
      - name: Build Vite Production Assets
        run: npm run build

      # Step 5: Prepare Clean Staged Directories
      - name: Prepare Staged Public and Backend Directories
        run: |
          # 1. Prepare Public Web Root (/public_html)
          mkdir -p deploy-public
          cp -r dist/* deploy-public/
          cp -f public/index.php deploy-public/
          cp -f public/.htaccess deploy-public/
          cp -f public/robots.txt deploy-public/ 2>/dev/null || true
          
          # Ensure all brand imagery is in place
          for img in crusaders_logo.jpg crusaders_hero.jpg crusader_air_cargo.jpg crusader_ocean_freight.jpg crusader_smart_hub.jpg crusader_courier.jpg crusader_logo_opt1.jpg crusader_logo_opt2.jpg crusader_logo_opt3.jpg; do
            if [ -f "public/$img" ]; then
              cp -f "public/$img" deploy-public/
            elif [ -f "src/assets/$img" ]; then
              cp -f "src/assets/$img" deploy-public/
            fi
          done

          # 2. Prepare Backend Application (/home/crusader/Crusader/Backend)
          mkdir -p deploy-backend
          rsync -av \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            backend/ deploy-backend/

      # Step 6: Deploy to cPanel Shared Hosting (Fast, auto-detects public_html, and falls back if FTPS is firewalled)
      - name: Deploy to cPanel Shared Hosting
        run: node scripts/deploy-cpanel.js
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_PUBLIC_DIR: ${{ secrets.FTP_PUBLIC_DIR || '' }}
          FTP_BACKEND_DIR: ${{ secrets.FTP_BACKEND_DIR || '' }}
